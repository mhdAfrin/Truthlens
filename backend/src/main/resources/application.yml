spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/truthlens}
    username: ${DB_USER:truthlens}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8093}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 8KB
    max-swallow-size: 8KB

truthlens:
  verification:
    max-code-points: ${VERIFICATION_MAX_CODE_POINTS:20000}
  workflow:
    enabled: true
    poll-ms: 1000
